name: Make Shots

on:
  workflow_dispatch:
    inputs:
      script_date:
        description: "Script date like 2026-10-21 (empty = newest script)"
        default: ""

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check script file is complete
        run: |
          if ! grep -q "END_OF_FILE_MARKER" tools/make_shots.py; then
            echo "tools/make_shots.py is cut off. Paste it again completely."
            exit 1
          fi
          python3 -m py_compile tools/make_shots.py

      - name: Make shots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPT_DATE: ${{ github.event.inputs.script_date }}
        run: python3 tools/make_shots.py

      - name: Save shots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/
          if ! git diff --cached --quiet; then
            git commit -m "Add shots file"
            git pull --rebase || true
            git push
          fi

name: Make Scene Prompts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build scenes from latest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, json, glob, sys, time
          import urllib.request, urllib.error

          key = os.environ["GEMINI_API_KEY"]
          TARGET_SCENES = 40

          files = sorted(glob.glob("scripts/horror-*.md"))
          if not files:
              sys.exit("ERROR: no script found in scripts/")
          src = files[-1]
          date = os.path.basename(src)[len("horror-"):-3]

          raw = open(src, encoding="utf-8").read().strip()
          lines = raw.split("\n")
          title = lines[0].lstrip("# ").strip()
          story = "\n".join(lines[1:]).strip()

          sentences = [
              s.strip()
              for s in re.split(r"(?<=[।!?\.])\s+", story.replace("\n", " "))
              if s.strip()
          ]
          total = sum(len(s.split()) for s in sentences)
          target = max(25, total // TARGET_SCENES)

          chunks, cur, cnt = [], [], 0
          for s in sentences:
              cur.append(s)
              cnt += len(s.split())
              if cnt >= target:
                  chunks.append(" ".join(cur))
                  cur, cnt = [], 0
          if cur:
              if chunks and cnt < target // 2:
                  chunks[-1] += " " + " ".join(cur)
              else:
                  chunks.append(" ".join(cur))

          numbered = "\n".join(f"{i+1}: {c}" for i, c in enumerate(chunks))

          PROMPT = f"""
          Below is a Hindi horror story split into {len(chunks)} numbered scenes.
          For each scene write ONE English image prompt describing what
          the viewer should SEE (setting, character action, mood, lighting).

          Also write ONE "character" description (English, 1-2 sentences:
          age, clothes, hair, face) of the main character. It will be added
          to every prompt for consistency. Setting: an Indian village.

          Rules for scene prompts:
          - Max 40 words each, no quotes, no dialogue.
          - Describe visuals only. No text, signs, letters or writing.
          - Atmospheric and scary but NOT gory.
          - Mix wide shots, close-ups and silhouettes for variety.

          Return ONLY valid JSON, no markdown fences, in this shape:
          {{"character": "...", "scenes": [{{"id": 1, "prompt": "..."}}]}}
          You must return exactly {len(chunks)} scenes.

          Scenes:
          {numbered}
          """

          def call():
              url = ("https://generativelanguage.googleapis.com/v1beta/"
                     "models/gemini-2.5-flash:generateContent")
              payload = {
                  "contents": [{"parts": [{"text": PROMPT}]}],
                  "generationConfig": {
                      "maxOutputTokens": 16000,
                      "temperature": 0.7,
                      "responseMimeType": "application/json",
                      "thinkingConfig": {"thinkingBudget": 0},
                  },
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json",
                           "x-goog-api-key": key},
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  data = json.loads(r.read())
              parts = data["candidates"][0]["content"]["parts"]
              text = "".join(p["text"] for p in parts if "text" in p).strip()
              text = re.sub(r"^```(?:json)?|```$", "", text).strip()
              return json.loads(text)

          result = None
          for attempt in range(1, 4):
              try:
                  r = call()
                  if len(r["scenes"]) == len(chunks):
                      result = r
                      break
                  print(f"Attempt {attempt}: got {len(r['scenes'])} scenes, need {len(chunks)}")
              except urllib.error.HTTPError as e:
                  print("HTTP error:", e.code, e.read().decode()[:400])
              except Exception as e:
                  print("Error:", repr(e)[:300])
              time.sleep(20 * attempt)

          if result is None:
              sys.exit("ERROR: could not get valid scene prompts.")

          STYLE = ("2D animated cartoon style, dark horror atmosphere, "
                   "dark blue and purple color palette, flat colors with "
                   "bold outlines, cinematic composition, no text, "
                   "no letters, no watermark. ")
          character = result["character"].strip()

          scenes = []
          for i, c in enumerate(chunks):
              sp = result["scenes"][i]["prompt"].strip()
              scenes.append({
                  "id": i + 1,
                  "text": c,
                  "words": len(c.split()),
                  "image_prompt": STYLE + "Main character: " + character + " Scene: " + sp,
              })

          os.makedirs("scenes", exist_ok=True)
          out = f"scenes/horror-{date}.json"
          with open(out, "w", encoding="utf-8") as f:
              json.dump({"title": title, "date": date, "scenes": scenes},
                        f, ensure_ascii=False, indent=2)

          avg = total // len(scenes)
          report = (
              "## Scenes result\n"
              f"- Script: {src}\n"
              f"- Title: {title}\n"
              f"- Total words: {total}\n"
              f"- Scenes: {len(scenes)} (about {avg} words each)\n"
              f"- Saved: {out}\n"
              f"- Scene 1 prompt: {scenes[0]['image_prompt'][:400]}\n"
              f"- Scene 2 prompt: {scenes[1]['image_prompt'][:400]}\n"
          )
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY

      - name: Save scenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/
          if ! git diff --cached --quiet; then
            git commit -m "Add scene prompts"
            git push
          fi

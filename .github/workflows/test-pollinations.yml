name: Test Pollinations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3 test images
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          from urllib.parse import quote

          style = ("2D animated cartoon style, dark horror atmosphere, "
                   "dark blue and purple color palette, flat colors with "
                   "bold outlines, cinematic composition, no text, "
                   "no letters, no watermark. ")
          ravi = ("Main character: Ravi, a man in his late 20s with a serious "
                  "but curious face, short dark hair, simple button-up shirt "
                  "and trousers. ")
          prompts = [
              style + "An old decaying Indian village haveli at night, "
                      "full moon, thick fog, one glowing window.",
              style + ravi + "Scene: Ravi stands at the haveli gate, "
                      "holding a lantern, wide shot.",
              style + ravi + "Scene: close-up of Ravi's frightened face, "
                      "a shadow figure behind him.",
          ]

          os.makedirs("test", exist_ok=True)
          lines = ["## Pollinations test"]

          for i, p in enumerate(prompts, 1):
              url = ("https://image.pollinations.ai/prompt/" + quote(p)
                     + "?width=1024&height=576&model=flux&nologo=true&seed="
                     + str(100 + i))
              saved = False
              for attempt in range(1, 4):
                  t0 = time.time()
                  try:
                      req = urllib.request.Request(
                          url, headers={"User-Agent": "horror-automation/1.0"})
                      with urllib.request.urlopen(req, timeout=180) as r:
                          ctype = r.headers.get("Content-Type", "")
                          raw = r.read()
                      if "image" not in ctype or len(raw) < 20000:
                          raise ValueError(f"bad response: {ctype}, {len(raw)} bytes")
                      path = f"test/poll-{i}.jpg"
                      open(path, "wb").write(raw)
                      lines.append(f"- Image {i}: SAVED {path} ({len(raw)//1024} KB, {time.time()-t0:.0f}s)")
                      saved = True
                      break
                  except urllib.error.HTTPError as e:
                      msg = e.read().decode()[:200]
                      lines.append(f"- Image {i} try {attempt}: HTTP {e.code} {msg}")
                      time.sleep(20)
                  except Exception as e:
                      lines.append(f"- Image {i} try {attempt}: {repr(e)[:200]}")
                      time.sleep(20)
              if not saved:
                  lines.append(f"- Image {i}: FAILED")
              time.sleep(16)

          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY

      - name: Save test images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Add Pollinations test"
            git pull --rebase || true
            git push
          fi

name: Test Cloudflare Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-cf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 2 test images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error

          acct = os.environ["CF_ACCOUNT_ID"].strip()
          token = os.environ["CF_API_TOKEN"].strip()
          model = "@cf/black-forest-labs/flux-1-schnell"
          url = ("https://api.cloudflare.com/client/v4/accounts/"
                 + acct + "/ai/run/" + model)

          style = ("2D animated cartoon style, dark horror atmosphere, "
                   "dark blue and purple colors, flat colors with bold outlines, "
                   "widescreen cinematic composition, no text, no letters, "
                   "no watermark. ")
          prompts = [
              style + "An abandoned old Indian haveli at night, full moon, "
                      "thick fog, one glowing yellow window.",
              style + "A frightened village boy holding a lantern, "
                      "standing in a dark narrow lane, a tall shadow "
                      "figure behind him.",
          ]

          lines = ["## Cloudflare image test", f"- Model: {model}"]
          os.makedirs("test", exist_ok=True)

          for i, p in enumerate(prompts, 1):
              payload = {"prompt": p, "steps": 4}
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "horror-automation/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data = json.loads(r.read())
                  b64 = data["result"]["image"]
                  raw = base64.b64decode(b64)
                  ext = "jpg" if raw[:2] == b"\xff\xd8" else "png"
                  path = f"test/cf-{i}.{ext}"
                  with open(path, "wb") as f:
                      f.write(raw)
                  lines.append(f"- Image {i}: SAVED {path} ({len(raw)//1024} KB)")
              except urllib.error.HTTPError as e:
                  lines.append(f"- Image {i}: HTTP ERROR {e.code}")
                  lines.append("  " + e.read().decode()[:500])
              except Exception as e:
                  lines.append(f"- Image {i}: ERROR {repr(e)[:300]}")

          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY

      - name: Save test images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Add Cloudflare image test"
            git push
          fi

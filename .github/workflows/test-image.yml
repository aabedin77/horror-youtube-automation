name: Test Image Generation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Try one image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error

          key = os.environ["GEMINI_API_KEY"]
          model = "gemini-2.5-flash-image"
          url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                 + model + ":generateContent")

          prompt = ("2D animated cartoon style horror scene, 16:9 widescreen: "
                    "an abandoned old haveli at night, full moon, thick fog, "
                    "one glowing window, dark blue and purple colors, "
                    "no text, no watermark.")

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]},
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json",
                       "x-goog-api-key": key},
          )

          lines = ["## Image test", f"- Model: {model}"]
          ok = False
          try:
              with urllib.request.urlopen(req, timeout=180) as r:
                  data = json.loads(r.read())
              for p in data["candidates"][0]["content"]["parts"]:
                  blob = p.get("inlineData") or p.get("inline_data")
                  if blob:
                      os.makedirs("test", exist_ok=True)
                      with open("test/test-image.png", "wb") as f:
                          f.write(base64.b64decode(blob["data"]))
                      ok = True
              lines.append("- Result: IMAGE SAVED" if ok
                           else "- Result: no image in response")
              if not ok:
                  lines.append("- Response: " + json.dumps(data)[:600])
          except urllib.error.HTTPError as e:
              lines.append(f"- Result: HTTP ERROR {e.code}")
              lines.append("- Message: " + e.read().decode()[:600])
          except Exception as e:
              lines.append("- Result: ERROR " + repr(e))

          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY

      - name: Save test image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Add image test"
            git push
          fi

name: Hindi Horror Script and Voice

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free TTS
        run: pip install edge-tts

      - name: Generate script and voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, asyncio
          from datetime import datetime, timezone
          import edge_tts

          key = os.environ["GEMINI_API_KEY"]
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          prompt = """
          Write an original Hindi horror story in Devanagari
          for a YouTube video, about 5 minutes long.
          Start with a strong hook, build suspense, and end
          with an unexpected twist. Output only the story.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent?key=" + key
          )

          payload = {
              "contents": [{"parts": [{"text": prompt}]}]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              data = json.loads(response.read())

          script = "\n".join(
              p["text"]
              for p in data["candidates"][0]["content"]["parts"]
              if "text" in p
          ).strip()

          os.makedirs("scripts", exist_ok=True)
          os.makedirs("audio", exist_ok=True)

          with open(f"scripts/horror-{date}.md", "w", encoding="utf-8") as f:
              f.write(script)

          async def make_audio():
              voice = edge_tts.Communicate(
                  script,
                  voice="hi-IN-SwaraNeural",
                  rate="-5%"
              )
              await voice.save(f"audio/horror-{date}.mp3")

          asyncio.run(make_audio())
          print("Hindi script and voice-over generated!")
          PY

      - name: Save content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Hindi horror script and voice-over"
            git push
          fi

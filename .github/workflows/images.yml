name: Make Scene Images

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: "How many images to make in this run"
        default: "40"
      steps:
        description: "Image quality steps 1-8 (4 = normal, more = slower and uses more quota)"
        default: "4"
      shots_date:
        description: "Shots file date like 2026-10-21 (empty = newest)"
        default: ""

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check script file is complete
        run: |
          if ! grep -q "END_OF_FILE_MARKER" tools/make_images.py; then
            echo "tools/make_images.py is cut off. Paste it again completely."
            exit 1
          fi
          python3 -m py_compile tools/make_images.py

      - name: Make images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MAX_IMAGES: ${{ github.event.inputs.max_images }}
          STEPS: ${{ github.event.inputs.steps }}
          SHOTS_DATE: ${{ github.event.inputs.shots_date }}
        run: python3 tools/make_images.py

      - name: Save images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Add shot images"
            git pull --rebase || true
            git push
          fi

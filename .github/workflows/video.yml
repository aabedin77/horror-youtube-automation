name: Make Video

on:
  workflow_dispatch:
    inputs:
      limit_shots:
        description: "Use only the first N shots (15 = quick test, 0 = full video)"
        default: "15"
      shots_date:
        description: "Shots file date like 2026-10-21 (empty = newest)"
        default: ""
      voice:
        description: "Edge TTS voice"
        default: "hi-IN-SwaraNeural"
      rate:
        description: "Speech speed, like -5% or +5%"
        default: "-5%"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and Hindi font
        run: |
          pip install edge-tts mutagen
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-freefont-ttf
          if fc-list | grep -qi "Noto Sans Devanagari"; then
            echo "FONT_NAME=Noto Sans Devanagari" >> "$GITHUB_ENV"
          else
            echo "FONT_NAME=FreeSans" >> "$GITHUB_ENV"
          fi
          ffmpeg -version | head -1

      - name: Check script files are complete
        run: |
          for f in tools/make_voice.py tools/make_video.py; do
            if ! grep -q "END_OF_FILE_MARKER" "$f"; then
              echo "$f is cut off. Paste it again completely."
              exit 1
            fi
            python3 -m py_compile "$f"
          done

      - name: Make voices
        env:
          VOICE: ${{ github.event.inputs.voice }}
          RATE: ${{ github.event.inputs.rate }}
          SHOTS_DATE: ${{ github.event.inputs.shots_date }}
          LIMIT_SHOTS: ${{ github.event.inputs.limit_shots }}
        run: python3 tools/make_voice.py

      - name: Make video
        env:
          SHOTS_DATE: ${{ github.event.inputs.shots_date }}
          LIMIT_SHOTS: ${{ github.event.inputs.limit_shots }}
        run: python3 tools/make_video.py

      - name: Upload video and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/*.mp4
            out/*.jpg
            scenes/timing-*.json
          retention-days: 3

      - name: Save timing file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/ || true
          git diff --cached --quiet || (git commit -m "Save voice timing" && git pull --rebase && git push)
